name: Query the live database

on:
  workflow_dispatch:
    inputs:
      sql:
        description: "SQL to run against the live database"
        required: true
        default: "SELECT version_num FROM alembic_version"

permissions:
  id-token: write
  contents: read

jobs:
  query:
    name: Query the live database
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::752919052098:role/github-deploy
          aws-region: us-east-1

      - name: Query
        env:
          DIAG_SQL: ${{ inputs.sql }}
        run: |
          set -uo pipefail

          TASK_ARN=$(aws ecs list-tasks \
            --cluster talent-hunting-cluster \
            --service-name talent-hunting-backend-svc \
            --desired-status RUNNING \
            --query 'taskArns[0]' --output text)
          echo "TASK_ARN=$TASK_ARN"

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "NO RUNNING TASK"
            exit 1
          fi

          for attempt in 1 2 3 4 5 6 7 8; do
            echo "--- attempt $attempt ---"
            if aws ecs execute-command \
              --cluster talent-hunting-cluster \
              --task "$TASK_ARN" \
              --container postgres \
              --interactive \
              --command "psql -U postgres -d talent_hunting -c \"$DIAG_SQL\"" \
              > /tmp/exec-out.txt 2>/tmp/exec-err.txt; then
              echo "=== RESULT ==="
              cat /tmp/exec-out.txt
              break
            fi
            head -3 /tmp/exec-err.txt
            sleep 8
          done
          echo "=== END ==="
