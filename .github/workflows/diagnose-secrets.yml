name: Diagnose the secrets context

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Report the length of each repository secret
        env:
          DEBUG: ${{ secrets.DEBUG }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          X_REDIRECT_URI: ${{ secrets.X_REDIRECT_URI }}
          X_SCOPES: ${{ secrets.X_SCOPES }}
          TR_PROBE_VALUE: ${{ secrets.TR_PROBE_VALUE }}
        run: |
          for name in DEBUG LOG_LEVEL DATABASE_URL X_CLIENT_ID X_CLIENT_SECRET X_REDIRECT_URI X_SCOPES TR_PROBE_VALUE; do
            value="${!name}"
            echo "$name length=${#value}"
          done
