name: Diagnose the secrets context

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Report the length of each repository secret
        env:
          DEBUG: ${{ secrets.DEBUG }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_ECHO: ${{ secrets.DB_ECHO }}
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          X_REDIRECT_URI: ${{ secrets.X_REDIRECT_URI }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_SCOPES: ${{ secrets.X_SCOPES }}
          AWS_BEDROCK_MODEL_ID: ${{ secrets.AWS_BEDROCK_MODEL_ID }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_DEFAULT_PROFILE: ${{ secrets.AWS_DEFAULT_PROFILE }}
          DM_DAILY_CAP: ${{ secrets.DM_DAILY_CAP }}
          DM_MIN_DELAY_SECONDS: ${{ secrets.DM_MIN_DELAY_SECONDS }}
          DM_MAX_DELAY_SECONDS: ${{ secrets.DM_MAX_DELAY_SECONDS }}
          DM_SIMILARITY_THRESHOLD: ${{ secrets.DM_SIMILARITY_THRESHOLD }}
          DM_POLL_INTERVAL_SECONDS: ${{ secrets.DM_POLL_INTERVAL_SECONDS }}
          DISCOVERY_SPEND_CEILING_USD: ${{ secrets.DISCOVERY_SPEND_CEILING_USD }}
          RUN_MIGRATIONS_ON_STARTUP: ${{ secrets.RUN_MIGRATIONS_ON_STARTUP }}
          ENABLE_DISPATCHER: ${{ secrets.ENABLE_DISPATCHER }}
        run: |
          for name in DEBUG LOG_LEVEL DATABASE_URL DB_ECHO X_CLIENT_ID X_CLIENT_SECRET X_REDIRECT_URI X_BEARER_TOKEN X_SCOPES AWS_BEDROCK_MODEL_ID AWS_BEARER_TOKEN_BEDROCK AWS_DEFAULT_PROFILE DM_DAILY_CAP DM_MIN_DELAY_SECONDS DM_MAX_DELAY_SECONDS DM_SIMILARITY_THRESHOLD DM_POLL_INTERVAL_SECONDS DISCOVERY_SPEND_CEILING_USD RUN_MIGRATIONS_ON_STARTUP ENABLE_DISPATCHER; do
            value="${!name}"
            echo "$name length=${#value}"
          done
