name: Deploy backend to ECS

# Pushes the backend image to ECR and updates the ECS service.
#
# The AWS region, the deploy role and the resource names are fixed values,
# not GitHub secrets. Only the application configuration comes from secrets.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  AWS_ROLE_TO_ASSUME: github-deploy
  ECR_REPOSITORY: talent-hunting
  ECS_CLUSTER: talent-hunting-cluster
  ECS_SERVICE: talent-hunting-backend-svc
  ECS_TASK_FAMILY: talent-hunting-backend

jobs:
  deploy:
    name: Build and deploy the backend
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::752919052098:role/github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Sync the repository secrets into Secrets Manager
        env:
          # The repository secrets hold the backend configuration. They are
          # write-only in GitHub, so they can only be read from inside the
          # workflow: that is why the sync happens here and not locally.
          #
          # Every value is prefixed with TR_SECRET_ so that a secret named
          # like an AWS CLI variable (AWS_DEFAULT_PROFILE) cannot shadow it
          # and break the CLI's own configuration.
          TR_SECRET_DEBUG: ${{ secrets.DEBUG }}
          TR_SECRET_LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          TR_SECRET_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TR_SECRET_DB_ECHO: ${{ secrets.DB_ECHO }}
          TR_SECRET_X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          TR_SECRET_X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          TR_SECRET_X_REDIRECT_URI: ${{ secrets.X_REDIRECT_URI }}
          TR_SECRET_X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TR_SECRET_X_SCOPES: ${{ secrets.X_SCOPES }}
          TR_SECRET_AWS_BEDROCK_MODEL_ID: ${{ secrets.AWS_BEDROCK_MODEL_ID }}
          TR_SECRET_AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          TR_SECRET_AWS_DEFAULT_PROFILE: ${{ secrets.AWS_DEFAULT_PROFILE }}
          TR_SECRET_DM_DAILY_CAP: ${{ secrets.DM_DAILY_CAP }}
          TR_SECRET_DM_MIN_DELAY_SECONDS: ${{ secrets.DM_MIN_DELAY_SECONDS }}
          TR_SECRET_DM_MAX_DELAY_SECONDS: ${{ secrets.DM_MAX_DELAY_SECONDS }}
          TR_SECRET_DM_SIMILARITY_THRESHOLD: ${{ secrets.DM_SIMILARITY_THRESHOLD }}
          TR_SECRET_DM_POLL_INTERVAL_SECONDS: ${{ secrets.DM_POLL_INTERVAL_SECONDS }}
          TR_SECRET_DISCOVERY_SPEND_CEILING_USD: ${{ secrets.DISCOVERY_SPEND_CEILING_USD }}
          TR_SECRET_RUN_MIGRATIONS_ON_STARTUP: ${{ secrets.RUN_MIGRATIONS_ON_STARTUP }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys

          keys = [
              "DEBUG", "LOG_LEVEL", "DATABASE_URL", "DB_ECHO",
              "X_CLIENT_ID", "X_CLIENT_SECRET", "X_REDIRECT_URI",
              "X_BEARER_TOKEN", "X_SCOPES",
              "AWS_BEDROCK_MODEL_ID", "AWS_BEARER_TOKEN_BEDROCK",
              "AWS_DEFAULT_PROFILE",
              "DM_DAILY_CAP", "DM_MIN_DELAY_SECONDS", "DM_MAX_DELAY_SECONDS",
              "DM_SIMILARITY_THRESHOLD", "DM_POLL_INTERVAL_SECONDS",
              "DISCOVERY_SPEND_CEILING_USD",
              "RUN_MIGRATIONS_ON_STARTUP",
          ]
          payload = {
              key: os.environ.get(f"TR_SECRET_{key}", "") for key in keys
          }

          region = os.environ["AWS_REGION"]
          secret_id = "talent-hunting/backend-config"

          def run(args):
              return subprocess.run(args, capture_output=True, text=True)

          # The secret may or may not exist yet, and its name carries a random
          # suffix, so the id is resolved rather than assumed.
          described = run([
              "aws", "secretsmanager", "describe-secret",
              "--secret-id", secret_id, "--region", region,
          ])
          existing: dict[str, str] = {}
          if described.returncode == 0:
              fetched = run([
                  "aws", "secretsmanager", "get-secret-value",
                  "--secret-id", secret_id, "--region", region,
              ])
              if fetched.returncode == 0:
                  try:
                      # The CLI returns the whole API response; the stored
                      # document is the SecretString inside it.
                      response = json.loads(fetched.stdout)
                      stored = response.get("SecretString", response)
                      existing = json.loads(stored)
                  except (json.JSONDecodeError, AttributeError, TypeError):
                      existing = {}
              # A repository secret that resolves to an empty string must not
              # wipe the value that is already stored.
              for key, value in existing.items():
                  if key in payload and not payload.get(key):
                      payload[key] = value

          # The values are never printed: they go straight into the secret.
          document = json.dumps(payload)

          if described.returncode == 0:
              action = "updated"
              updated = run([
                  "aws", "secretsmanager", "put-secret-value",
                  "--secret-id", secret_id, "--secret-string", document,
                  "--region", region,
              ])
          else:
              action = "created"
              updated = run([
                  "aws", "secretsmanager", "create-secret",
                  "--name", secret_id, "--secret-string", document,
                  "--region", region,
              ])
              if updated.returncode != 0 and "ResourceExistsException" in updated.stderr:
                  # It exists after all: fall back to updating it.
                  action = "updated"
                  updated = run([
                      "aws", "secretsmanager", "put-secret-value",
                      "--secret-id", secret_id, "--secret-string", document,
                      "--region", region,
                  ])

          if updated.returncode != 0:
              sys.stderr.write(described.stderr)
              sys.stderr.write(updated.stderr)
              sys.exit(updated.returncode)

          empty = sorted(k for k, v in payload.items() if not v)
          print(f"{action} {secret_id}")
          if empty:
              print("WARNING: empty repository secrets: " + ", ".join(empty))
          PY

      - name: Build and push the image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REPOSITORY:$IMAGE_TAG" .
          docker tag "$ECR_REPOSITORY:$IMAGE_TAG" \
            "${{ steps.ecr-login.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "${{ steps.ecr-login.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Render the ECS task definition
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ecs describe-task-definition --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition > task-definition.json
          jq --arg image "${{ steps.ecr-login.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG" \
            '.containerDefinitions[0].image = $image' task-definition.json > task-definition-new.json
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            task-definition-new.json > task-definition-clean.json
          aws ecs register-task-definition \
            --cli-input-json file://task-definition-clean.json \
            --query taskDefinition.taskDefinitionArn --output text > task-definition-arn.txt
          echo "registered $(cat task-definition-arn.txt)"

      - name: Update the ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$(cat task-definition-arn.txt)" \
            --force-new-deployment > /dev/null
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      - name: Verify the service is healthy
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].{running:runningCount,desired:desiredCount,deployments:length(deployments)}'

  test:
    name: Quality gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talent_hunting
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d talent_hunting"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check app tests

      - name: Mypy
        run: uv run mypy app

      - name: Pytest
        run: uv run pytest -q
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/talent_hunting
